name: Dependency Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 1'
  pull_request:
    paths:
      - 'backend/services/data-processing-service/Cargo.lock'
      - 'backend/services/data-processing-service/Cargo.toml'
      - 'backend/services/oracle-api/Cargo.lock'
      - 'backend/services/oracle-api/Cargo.toml'

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-17
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Oracle API dependencies
        run: cargo audit --file backend/services/oracle-api/Cargo.lock
      - name: Audit data-processing dependencies
        run: cargo audit --file backend/services/data-processing-service/Cargo.lock
